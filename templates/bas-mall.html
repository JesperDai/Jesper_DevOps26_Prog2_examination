
<!doctype html>
<html lang="sv">

<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    
    <title>{% block title %}Väderapplikation{% endblock %}</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <!-- Application name -->
            <a class="navbar-brand" href="{{ url_for('filter_data') }}">
                Weather forecast
            </a>

        </div>
    </nav>


    <!-- Main content of each page -->
    <main class="container my-4">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
<footer class ="mt-4 mb-3 text">
    <p style="text-align: center;">
        <a href="https://open-meteo.com/" >Väder data från Open-Meteo.com</a>,
        licensierad under
        <a href="https://creativecommons.org/licenses/by/4.0/deed.sv"> CC BY 4.0</a>,
        Datan har bearbetats till månadsvärden
    </p>
</footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
