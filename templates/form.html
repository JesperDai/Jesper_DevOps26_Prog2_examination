

<form method="POST" action="{{ url_for('filter_data') }}">

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="text-center">

                <select class="form-select form-select-lg" aria-label="Choose a city" id="city" name="city">
                    
                <option value="">Choose a city:</option>

                <option value="Stockholm">
                    {% if selected_city == "Stockholm" %}selected{% endif %}>
                    Stockholm
                </option>

                <option value="Göteborg">
                    {% if selected_city == "Göteborg" %}selected{% endif %}>
                    Göteborg
                </option>

                <option value="Malmö">
                    {% if selected_city == "Malmö" %}selected{% endif %}>
                    Malmö
                </option>

                <option value="Umeå">
                    {% if selected_city == "Umeå" %}selected{% endif %}>
                    Umeå
                </option>

                <option value="Kiruna">
                    {% if selected_city == "Kiruna" %}selected{% endif %}>
                    Kiruna
                </option>

    

                </select>

                <!-- Submit button -->
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    show forecast
                </button>

            </div>
        </div>
    </div>

</form>
